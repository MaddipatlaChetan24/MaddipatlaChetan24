name: Generate Profile Cards

# Builds the snake, 3D contribution city and developer dashboard
# with your own token,
# so they keep working while your GitHub profile is private.
# Requires a repository secret named PROFILE_TOKEN (classic personal access
# token with the read:user and repo scopes).

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.PROFILE_TOKEN }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#004e92&color_dots=#ebedf0,#b3e5fc,#4fc3f7,#0288d1,#01579b
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#00c6ff&color_dots=#161b22,#0a3069,#0550ae,#0969da,#00c6ff

      - name: Developer dashboard
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: |
          python3 scripts/profile_cards.py dashboard "$RUNNER_TEMP/cards"
          python3 scripts/profile_cards.py data "$RUNNER_TEMP/cards"
          python3 scripts/profile_cards.py prs "$RUNNER_TEMP/cards"

      - name: 3D contribution city
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Collect cards
        run: |
          sudo cp "$RUNNER_TEMP/cards/dashboard.svg" "$RUNNER_TEMP/cards/profile-data.json" dist/
          sudo cp profile-3d-contrib/profile-night-view.svg dist/contribution-city.svg
          sudo chown -R "$(id -u):$(id -g)" dist

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
