name: Generate Profile Cards

# Builds the snake, 3D contribution city, developer dashboard, stats,
# languages and streak cards with your own token,
# so they keep working while your GitHub profile is private.
# Requires a repository secret named PROFILE_TOKEN (classic personal access
# token with the read:user and repo scopes).

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.PROFILE_TOKEN }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#004e92&color_dots=#ebedf0,#b3e5fc,#4fc3f7,#0288d1,#01579b
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#00c6ff&color_dots=#161b22,#0a3069,#0550ae,#0969da,#00c6ff

      - name: Stats and languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.PROFILE_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: github-metrics.svg
          output_action: none
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Kolkata
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used

      - name: Contribution calendar and streak
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.PROFILE_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: github-streak.svg
          output_action: none
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Developer dashboard
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: python3 scripts/profile_cards.py dashboard "$RUNNER_TEMP/cards"

      - name: 3D contribution city
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Collect cards
        run: |
          sudo cp /metrics_renders/github-metrics.svg /metrics_renders/github-streak.svg dist/
          sudo cp "$RUNNER_TEMP/cards/dashboard.svg" dist/
          sudo cp profile-3d-contrib/profile-night-view.svg dist/contribution-city.svg
          sudo chown -R "$(id -u):$(id -g)" dist

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
