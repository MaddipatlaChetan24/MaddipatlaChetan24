name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#004e92&color_dots=#ebedf0,#b3e5fc,#4fc3f7,#0288d1,#01579b
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#00c6ff&color_dots=#161b22,#0a3069,#0550ae,#0969da,#00c6ff

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
