<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 230" width="1280" height="230" role="img" aria-label="Let's connect"><title>Let's connect</title><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1222"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity=".7"/><stop offset=".5" stop-color="#3b82f6" stop-opacity=".25"/><stop offset="1" stop-color="#6366f1" stop-opacity=".7"/></linearGradient>
<linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset=".55" stop-color="#3b82f6"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1e293b"/></pattern>
<filter id="glow" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
<style>
text{font-family:'Segoe UI', Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif}
.mono{font-family:ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
.tag{font-family:ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:13px;letter-spacing:2.5px;font-weight:600}
.h2{font-size:30px;font-weight:700;fill:#e6edf3}
.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

.wave{animation:wave 8s ease-in-out infinite alternate}@keyframes wave{to{transform:translateX(-120px)}}
.float{animation:float 5s ease-in-out infinite alternate}@keyframes float{to{transform:translateY(-14px)}}

</style>
</defs><rect x="0" y="0" width="1280" height="230" rx="24" fill="url(#bg)"/><rect x="0" y="0" width="1280" height="230" rx="24" fill="url(#dots)" opacity=".6"/><rect x="0.75" y="0.75" width="1278.5" height="228.5" rx="24" fill="none" stroke="url(#edge)" stroke-width="1.5"/><g class="wave" opacity=".5"><path d="M0 180C160 140 320 220 480 180S800 140 960 180 1280 220 1440 180V230H0z" fill="#3b82f6" opacity=".15"/><path d="M0 200C160 170 320 230 480 200S800 170 960 200 1280 230 1440 200V230H0z" fill="#22d3ee" opacity=".12"/></g><circle class="float" style="animation-delay:0.00s" cx="80" cy="40" r="1.5" fill="#22d3ee" opacity=".6"/><circle class="float" style="animation-delay:0.37s" cx="168" cy="93" r="2.5" fill="#3b82f6" opacity=".6"/><circle class="float" style="animation-delay:0.74s" cx="256" cy="146" r="3.5" fill="#a78bfa" opacity=".6"/><circle class="float" style="animation-delay:1.11s" cx="344" cy="79" r="1.5" fill="#22d3ee" opacity=".6"/><circle class="float" style="animation-delay:1.48s" cx="432" cy="132" r="2.5" fill="#3b82f6" opacity=".6"/><circle class="float" style="animation-delay:1.85s" cx="520" cy="65" r="3.5" fill="#a78bfa" opacity=".6"/><circle class="float" style="animation-delay:2.22s" cx="608" cy="118" r="1.5" fill="#22d3ee" opacity=".6"/><circle class="float" style="animation-delay:2.59s" cx="696" cy="51" r="2.5" fill="#3b82f6" opacity=".6"/><circle class="float" style="animation-delay:2.96s" cx="784" cy="104" r="3.5" fill="#a78bfa" opacity=".6"/><circle class="float" style="animation-delay:3.33s" cx="872" cy="157" r="1.5" fill="#22d3ee" opacity=".6"/><circle class="float" style="animation-delay:3.70s" cx="960" cy="90" r="2.5" fill="#3b82f6" opacity=".6"/><circle class="float" style="animation-delay:4.07s" cx="1048" cy="143" r="3.5" fill="#a78bfa" opacity=".6"/><circle class="float" style="animation-delay:4.44s" cx="1136" cy="76" r="1.5" fill="#22d3ee" opacity=".6"/><circle class="float" style="animation-delay:4.81s" cx="1224" cy="129" r="2.5" fill="#3b82f6" opacity=".6"/><text x="640" y="74" text-anchor="middle" class="tag" fill="#22d3ee">// LET&#8217;S CONNECT</text><text x="640" y="124" text-anchor="middle" font-size="36" font-weight="800" fill="url(#brand)">Let&#8217;s build something intelligent together</text><text x="640" y="160" text-anchor="middle" font-size="17" fill="#94a3b8">Open to internships, collaborations and AI projects &#8212; reach out below.</text></svg>