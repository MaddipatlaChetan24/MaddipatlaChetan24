.h2{font-size:30px;font-weight:700;fill:#e6edf3}
.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

.l0{animation:l0 12s infinite}@keyframes l0{0%,4%{opacity:0}7%,92%{opacity:1}97%,100%{opacity:0}}.l1{animation:l1 12s infinite}@keyframes l1{0%,13%{opacity:0}16%,92%{opacity:1}97%,100%{opacity:0}}.l2{animation:l2 12s infinite}@keyframes l2{0%,22%{opacity:0}25%,92%{opacity:1}97%,100%{opacity:0}}.l3{animation:l3 12s infinite}@keyframes l3{0%,31%{opacity:0}34%,92%{opacity:1}97%,100%{opacity:0}}.l4{animation:l4 12s infinite}@keyframes l4{0%,40%{opacity:0}43%,92%{opacity:1}97%,100%{opacity:0}}.l5{animation:l5 12s infinite}@keyframes l5{0%,49%{opacity:0}52%,92%{opacity:1}97%,100%{opacity:0}}
@keyframes slide{0%{opacity:0}3%{opacity:1}22.00%{opacity:1}25.00%,100%{opacity:0}}
.s0{animation:slide 16s infinite;animation-delay:0s;opacity:0}.s1{animation:slide 16s infinite;animation-delay:4s;opacity:0}.s2{animation:slide 16s infinite;animation-delay:8s;opacity:0}.s3{animation:slide 16s infinite;animation-delay:12s;opacity:0}
@keyframes seg{0%{width:0}25.00%{width:124px}25.01%,100%{width:0}}
.g0{animation:seg 16s linear infinite;animation-delay:0s}.g1{animation:seg 16s linear infinite;animation-delay:4s}.g2{animation:seg 16s linear infinite;animation-delay:8s}.g3{animation:seg 16s linear infinite;animation-delay:12s}
.cur{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
.ring{animation:ring 3s ease-out infinite alternate}@keyframes ring{from{stroke-dashoffset:113}}
.bob{animation:bob 3s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-6px)}}
.spin{transform-origin:968px 290px;animation:spin 10s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.unspin{animation:spin 10s linear infinite reverse;transform-box:fill-box;transform-origin:center}
.scan{animation:scan 2.4s ease-in-out infinite alternate}@keyframes scan{from{transform:translateY(0)}to{transform:translateY(190px)}}
.draw{stroke-dasharray:520;animation:draw 4s ease-out infinite}@keyframes draw{from{stroke-dashoffset:520}to{stroke-dashoffset:0}}

</style>
